      modal("Reset plan", `<p>${lang === "ar" ? "\u0647\u0644 \u062A\u0631\u064A\u062F \u0625\u0639\u0627\u062F\u0629 \u0625\u0646\u0634\u0627\u0621 \u0627\u0644\u0639\u0627\u062F\u0627\u062A \u0645\u0646 \u0625\u062C\u0627\u0628\u0627\u062A\u0643\u061F \u0633\u064A\u0628\u0642\u0649 \u0627\u0644\u0633\u062C\u0644 \u0627\u0644\u0633\u0627\u0628\u0642 \u0648\u0627\u0644\u062F\u064A\u0648\u0646 \u0648\u0627\u0644\u0643\u0644\u0645\u0627\u062A \u0645\u062D\u0641\u0648\u0638\u064B\u0627." : lang === "ur" ? "\u0627\u067E\u0646\u06D2 \u062C\u0648\u0627\u0628\u0627\u062A \u0633\u06D2 \u0639\u0627\u062F\u0627\u062A \u062F\u0648\u0628\u0627\u0631\u06C1 \u0628\u0646\u0627\u0626\u06CC\u06BA\u061F \u0633\u0627\u0628\u0642\u06C1 \u0631\u06CC\u06A9\u0627\u0631\u0688\u060C \u0642\u0631\u0636 \u0627\u0648\u0631 \u0627\u0644\u0641\u0627\u0638 \u0645\u062D\u0641\u0648\u0638 \u0631\u06C1\u06CC\u06BA \u06AF\u06D2\u06D4" : lang === "ml" ? "നിങ്ങളുടെ ഉത്തരങ്ങളിൽ നിന്ന് ശീലങ്ങൾ പുനഃസൃഷ്ടിക്കണോ? മുൻകാല ചരിത്രവും കടങ്ങളും വാക്കുകളും സുരക്ഷിതമായി നിലനിൽക്കും." : lang === "hi" ? "क्या आप अपने उत्तरों से आदतें फिर से बनाना चाहते हैं? आपका इतिहास, क़र्ज़ और शब्द सुरक्षित रहेंगे।" : "Regenerate habits from your answers? Your history, debts, and words will be kept."}</p><button class="btn section-gap" data-action="confirm-reset">${t("Reset plan")}</button>`);
      break;
    case "confirm-reset":
      state.habits = engine.generate(state.profile).habits;
      state.schedule = [];
      syncTodayHabits();
      $("#modal").close();
      render();
      toast("Saved");
      break;
    case "verse-audio": {
      let v = quranService.daily();
      if (v) playAudio(quranService.audio(v));
      break;
    }
    case "test-sound":
      if (state.settings.sound === "silent") toast("Silent");
      else playAdhan();
      break;
    case "notifications":
      await notifications();
      break;
    case "check-updates":
      if ("serviceWorker" in navigator) {
        const registration = await navigator.serviceWorker.getRegistration();
        if (registration) await registration.update().catch(() => {});
      }
      location.reload();
      break;
    case "install":
      if (installEvent) {
        await installEvent.prompt();
        await installEvent.userChoice;
        installEvent = null;
      } else toast("Use your browser menu: Install app, or Share \u2192 Add to Home Screen.");
      break;
    case "timer":
      if (pomodoro.running) {
        tickTimer();
        pomodoro.running = false;
      } else {
        if (!pomodoro.remaining) pomodoro.remaining = 25 * 60;
        pomodoro.ends = Date.now() + pomodoro.remaining * 1e3;
        pomodoro.running = true;
      }
      render();
      break;
    case "timer-reset":
      pomodoro.running = false;
      pomodoro.remaining = 25 * 60;
      render();
      break;
  }
});
document.addEventListener("change", async (e) => {
  const el = e.target;
  if (el.dataset.draftDebt) {
    draftDebt[el.dataset.draftDebt] = el.value;
    return;
  }
  if (el.dataset.draft) {
    const k = el.dataset.draft;
    const valid = updateProfile(k, el.type === "checkbox" ? el.checked : el.value, draft);
    if (!valid) {
      toast("Check your location or time zone.");
      el.focus();
      return;
    }
    if (k === "language") {
      lang = draft.language;
      document.documentElement.lang = lang;
      document.documentElement.dir = ["ar", "ur"].includes(lang) ? "rtl" : "ltr";
      renderWizard();
    }
    if (["city", "country", "hasDebts"].includes(k)) renderWizard();
    return;
  }
  if (el.dataset.multi) {
    const k = el.dataset.multi;
    if (el.checked && !draft[k].includes(el.value)) draft[k].push(el.value);
    if (!el.checked) draft[k] = draft[k].filter((v) => v !== el.value);
    if (k === "goals") renderWizard();
    return;
  }
  if (el.dataset.goal) {
    draft.goalText[el.dataset.goal] = el.value;
    return;
  }
  if (el.dataset.profile) {
    const k = el.dataset.profile;
    if (!updateProfile(k, el.type === "checkbox" ? el.checked : el.value, state.profile)) {
      toast("Check your location or time zone.");
      render();
      return;
    }
    lang = state.profile.language;
    save();
    render();
    return;
  }
  if (el.dataset.habit) {
    logHabit(el.dataset.habit, el.value);
    return;
  }
  if (el.dataset.zakat) {
    state.zakat[el.dataset.zakat] = Math.max(0, +el.value || 0);
    save();
    render();
    return;
  }
  if (el.dataset.editHabit) {
    let h = state.habits.find((h2) => h2.id === el.dataset.editHabit);
    if (!h) return;
    const key = el.dataset.key;
    if (key === "target") {
      let n = Number(el.value);
      if (!Number.isFinite(n) || n <= 0 || n > 1e6) {
        toast("Target must be between 1 and 1,000,000.");
        render();
        return;
      }
      h.target = n;
    } else h[key] = el.value.trim() || h[key];
    syncTodayHabits();
    return;
  }
  if (el.dataset.reward) {
    let child = state.children.find((c) => c.id === el.dataset.reward);
    if (child) child.reward = el.value;
    save();
    return;
  }
  if (el.dataset.kidMinutes) {
    const d = getDay();
    d.kidMinutes ??= {};
    d.kidMinutes[el.dataset.kidMinutes] = Math.max(0, +el.value || 0);
    save();
    return;
  }
  switch (el.id) {
    case "day-picker":
      if (el.value && el.value <= today()) {
        selectedDate = el.value;
        render();
      }
      break;
    case "month-picker":
      if (/^\d{4}-\d{2}$/.test(el.value)) {
        month = el.value;
        render();
      }
      break;
    case "pause-faith":
      getDay().pauseFaith = el.checked;
      save();
      render();
      break;
    case "stress":
      getDay().stress = +el.value;
      save();
      $("#stress-value").textContent = el.value;
      break;
    case "enable-debts":
      state.profile.hasDebts = el.checked;
      save();
      render();
      break;
    case "savings-amount":
      state.savings[month] = Math.max(0, +el.value || 0);
      save();
      render();
      break;
    case "theme-select":
      state.settings.theme = el.value;
      save();
      render();
      break;
    case "sound-select":
      state.settings.sound = el.value;
      save();
      break;
    case "tasbih-adhkar":
      state.tasbih.selected = el.value;
      save();
      render();
      break;
    case "tasbih-link":
      state.tasbih.link = el.value;
      save();
      break;
    case "import-file": {
      const file = el.files[0];
      if (!file) return;
      if (file.size > 10 * 1024 * 1024) return toast("Backup is too large (maximum 10 MB).");
      try {
        const text = await file.text();
        if (/"(?:__proto__|constructor|prototype)"\s*:/.test(text)) throw Error();
        let incoming = JSON.parse(text);
        if (!validate(incoming)) throw Error();
        window.pendingImport = incoming;
        modal("Import backup", `<p>${lang === "ar" ? "\u0633\u064A\u062D\u0644 \u0647\u0630\u0627 \u0627\u0644\u0646\u0633\u062E \u0627\u0644\u0627\u062D\u062A\u064A\u0627\u0637\u064A \u0645\u062D\u0644 \u0627\u0644\u0628\u064A\u0627\u0646\u0627\u062A \u0627\u0644\u062D\u0627\u0644\u064A\u0629. \u0635\u062F\u0651\u0631 \u0628\u064A\u0627\u0646\u0627\u062A\u0643 \u0623\u0648\u0644\u064B\u0627 \u0644\u0644\u0627\u062D\u062A\u0641\u0627\u0638 \u0628\u0647\u0627." : lang === "ur" ? "\u06CC\u06C1 \u0628\u06CC\u06A9 \u0627\u067E \u0645\u0648\u062C\u0648\u062F\u06C1 \u0631\u06CC\u06A9\u0627\u0631\u0688 \u06A9\u06CC \u062C\u06AF\u06C1 \u0644\u06D2 \u06AF\u0627\u06D4 \u067E\u06C1\u0644\u06D2 \u0645\u0648\u062C\u0648\u062F\u06C1 \u0688\u06CC\u0679\u0627 \u0628\u0631\u0622\u0645\u062F \u06A9\u0631 \u0644\u06CC\u06BA\u06D4" : lang === "ml" ? "ഈ ബാക്കപ്പ് ഈ ഉപകരണത്തിലെ രേഖകൾക്ക് പകരമായി മാറും. നിലവിലുള്ള വിവരങ്ങൾ സൂക്ഷിക്കാൻ ആഗ്രഹിക്കുന്നുവെങ്കിൽ ആദ്യം ബാക്കപ്പ് എക്‌സ്‌പോർട്ട് ചെയ്യുക." : lang === "hi" ? "यह बैकअप इस डिवाइस के रिकॉर्ड को बदल देगा। यदि आप इसे रखना चाहते हैं तो पहले अपना वर्तमान डेटा एक्सपोर्ट करें।" : "This backup will replace the records on this device. Export your current data first if you want to keep it."}</p><div class="row wrap section-gap"><button class="btn secondary" data-action="backup">${t("Export backup")}</button><button class="btn" id="confirm-import">${t("Import backup")}</button></div>`);
      } catch {
        toast("This file is not a valid Istiqamah backup.");
      }
      break;
    }
  }
});
document.addEventListener("click", (e) => {
  if (e.target.id === "confirm-import" && window.pendingImport) {
    state = { ...fresh(), ...window.pendingImport, profile: { ...defaults(), ...window.pendingImport.profile }, settings: { ...fresh().settings, ...window.pendingImport.settings } };
    delete window.pendingImport;
    lang = state.profile.language;
    try {
      new Intl.DateTimeFormat("en", { timeZone: state.profile.tz }).format();
    } catch {
      state.profile.tz = timezone();
    }
    save();
    $("#modal").close();
    selectedDate = today();
    month = today().slice(0, 7);
    render();
    toast("Saved");
  }
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.dataset.journal) {
    getDay().journal[el.dataset.journal] = el.value;
    save();
  }
  if (el.dataset.review) {
    state.reviews[month] ??= {};
    state.reviews[month][el.dataset.review] = el.value;
    save();
  }
  if (el.id === "stress") $("#stress-value").textContent = el.value;
});
document.addEventListener("submit", (e) => {
  const form = e.target;
  if (!["habit-form", "debt-form", "word-form", "schedule-form", "block-form"].includes(form.id)) return;
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form));
  switch (form.id) {
    case "habit-form":
      if (state.habits.length >= 100) return toast("A maximum of 100 habits is supported.");
      state.habits.push({ id: uid(), label: data.label.trim(), category: data.category, target: +data.target, unit: data.unit.trim(), weight: 1 });
      syncTodayHabits();
      render();
      break;
    case "debt-form": {
      const total = Number(data.total), paid = Number(data.paid);
      if (!Number.isFinite(total) || total <= 0 || !Number.isFinite(paid) || paid < 0 || paid > total) return toast("Already paid must be between zero and the total.");
      state.debts.push({ id: uid(), name: data.name.trim(), total, paid, payments: paid ? [{ date: today(), amount: paid }] : [] });
      save();
      render();
      break;
    }
    case "word-form":
      state.words.push({ id: uid(), ...data, date: today() });
      {
        const d = getDay(today());
        d.values.words = (d.values.words || 0) + 1;
      }
      save();
      render();
      break;
    case "schedule-form":
      $$("#schedule-form [data-block-time]").forEach((el) => {
        const id = el.dataset.blockTime, label = $$("#schedule-form [data-block-label]").find((i) => i.dataset.blockLabel === id).value;
        let b = state.schedule.find((b2) => b2.id === id);
        if (b) Object.assign(b, { time: el.value, label, hidden: false });
        else state.schedule.push({ id, time: el.value, label });
      });
      save();
      $("#modal").close();
      render();
      break;
    case "block-form":
      state.schedule.push({ id: uid(), label: data.label.trim(), time: data.time });
      save();
      $("#modal").close();
      showSchedule();
      break;
  }
});
$("#wizard").addEventListener("cancel", (e) => {
  e.preventDefault();
  if (state.onboarded) {
    $("#wizard").close();
    lang = state.profile.language;
    render();
  } else if (validateDraft()) finishPlan();
});
window.addEventListener("storage", (e) => {
  if (e.key === storage.key && e.newValue) {
    toast("Another tab changed your data. Reload to see the latest records.");
  }
});
render();
if (!state.onboarded) showWizard();
if (storageError) toast("Saved data could not be read. Import a backup before making changes.");
registerWorker();
let lastToday = today();
setInterval(() => {
  prayerService.tick();
  tickTimer();
  let now = today();
  if (now !== lastToday) {
    if (selectedDate === lastToday) selectedDate = now;
    if (month === lastToday.slice(0, 7)) month = now.slice(0, 7);
    lastToday = now;
    render();
  }
}, 1e3);
window.Istiqamah = { get state() {
  return state;
}, engine, prayerService, hijriService, quranService, hadithService, adhkarService, storage, ui, score, categoryScore, streak, habitStreak, today, getDay, offsetDay, zonedDate, currentSchedule, exportCalendar, validate, render };
</script></body></html>
